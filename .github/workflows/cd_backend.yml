#Build the docker image
#Push the docker image to docker hub
#SSH to the vm and start the new image

name: Build and Push Docker Image Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-backend:${{ github.sha }}
      - name: Deploy to the VM
        run: |
          echo "${{secrets.SSH_PRIVATE_KEY}}" &> ~/ssh_key
          mkdir -p /home/runner/.ssh
          chmod 700 /home/runner/ssh_key
          ssh -o StrictHostChecking=no -i ~/ssh_key ubuntu-vm-3-todo@4.252.1.59 -t "sudo docker stop todo-app-backend && docker run --name todo-app-backend -d -p 3000:3000 sumittim/todo-app-backend:${{github.sha}}"